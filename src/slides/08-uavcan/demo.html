<section>
  <h3 style="font-size: 1.4rem;">Топология: точка-точка против шины</h3>

  <div style="display: flex; align-items: center; gap: 12px; margin: 0 0 1rem;">
    <label style="font-size: 14px; color: #ccc; white-space: nowrap;">Число ESC на дроне</label>
    <input id="uavcan-n" type="range" min="2" max="12" value="4" step="1" style="flex: 1;" />
    <span id="uavcan-n-out" style="font-size: 14px; font-weight: 500; min-width: 30px; text-align: right; color: #fff;">4</span>
  </div>

  <svg width="100%" viewBox="0 0 680 300" role="img">
    <text x="20" y="18" fill="#aaa" font-size="13">DShot: точка-точка — свой провод на каждый ESC</text>
    <rect x="20" y="30" width="70" height="40" rx="6" fill="#222" stroke="#888" stroke-width="0.5"></rect>
    <text x="55" y="54" text-anchor="middle" fill="#fff" font-size="12">FC</text>
    <g id="uavcan-p2p"></g>

    <line x1="20" y1="160" x2="660" y2="160" stroke="#333" stroke-width="1"></line>

    <text x="20" y="185" fill="#aaa" font-size="13">UAVCAN: общая шина — один провод на всех</text>
    <rect x="20" y="197" width="70" height="40" rx="6" fill="#222" stroke="#888" stroke-width="0.5"></rect>
    <text x="55" y="221" text-anchor="middle" fill="#fff" font-size="12">FC</text>
    <g id="uavcan-bus"></g>
  </svg>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1rem;">
    <div style="background: #222; border-radius: 8px; padding: 1rem;">
      <p style="font-size: 13px; color: #aaa; margin: 0;">Проводов до ESC (DShot)</p>
      <p id="uavcan-wires-p2p" style="font-size: 24px; font-weight: 500; margin: 4px 0 0; color: #fff;">4</p>
    </div>
    <div style="background: #222; border-radius: 8px; padding: 1rem;">
      <p style="font-size: 13px; color: #aaa; margin: 0;">Проводов на шине (UAVCAN)</p>
      <p style="font-size: 24px; font-weight: 500; margin: 4px 0 0; color: #fff;">1</p>
    </div>
  </div>
</section>
