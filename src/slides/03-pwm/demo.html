<section>
  <h3 style="font-size: 1.4rem;">RC PWM: серия импульсов подряд</h3>

  <div style="display: flex; align-items: center; gap: 12px; margin: 0 0 1.25rem;">
    <label style="font-size: 14px; color: #ccc; white-space: nowrap;">Ширина импульса</label>
    <input id="pw3" type="range" min="1000" max="2000" value="1500" step="10" style="flex: 1;" />
    <span id="pw3-out" style="font-size: 14px; font-weight: 500; min-width: 70px; text-align: right; color: #fff;">1500 мкс</span>
  </div>

  <svg width="100%" viewBox="0 0 680 200" role="img">
    <line x1="20" y1="160" x2="660" y2="160" stroke="#888" stroke-width="0.5"></line>
    <text x="10" y="64" text-anchor="middle" fill="#ccc" font-size="14">5V</text>
    <text x="10" y="164" text-anchor="middle" fill="#ccc" font-size="14">0V</text>
    <line x1="20" y1="50" x2="20" y2="160" stroke="#888" stroke-width="0.5"></line>

    <path id="pwm-path3" fill="none" stroke="#378ADD" stroke-width="2" stroke-linejoin="round"></path>

    <line id="pmark0a" x1="0" y1="50" x2="0" y2="160" stroke="#666" stroke-width="0.5" stroke-dasharray="3 3"></line>
    <line id="pmark0b" x1="0" y1="50" x2="0" y2="160" stroke="#666" stroke-width="0.5" stroke-dasharray="3 3"></line>
    <text id="pw-label3" x="0" y="40" text-anchor="middle" fill="#ccc" font-size="13"></text>

    <line id="period-a" x1="0" y1="178" x2="0" y2="178" stroke="#666" stroke-width="0.5"></line>
    <text id="period-label" x="0" y="196" text-anchor="middle" fill="#aaa" font-size="12">период 20 мс</text>
  </svg>

  <div style="display: flex; align-items: center; gap: 2rem; margin-top: 1rem;">
    <svg width="160" height="120" viewBox="0 0 160 120" role="img">
      <rect x="10" y="70" width="140" height="40" rx="8" fill="#222" stroke="#888" stroke-width="0.5"></rect>
      <circle cx="80" cy="70" r="6" fill="#aaa"></circle>
      <line id="servo-arm3" x1="80" y1="70" x2="80" y2="20" stroke="#D85A30" stroke-width="4" stroke-linecap="round"></line>
      <circle id="servo-tip3" cx="80" cy="20" r="4" fill="#D85A30"></circle>
    </svg>

    <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div style="background: #222; border-radius: 8px; padding: 1rem;">
        <p style="font-size: 13px; color: #aaa; margin: 0;">Угол сервы</p>
        <p id="angle-out3" style="font-size: 24px; font-weight: 500; margin: 4px 0 0; color: #fff;">0°</p>
      </div>
      <div style="background: #222; border-radius: 8px; padding: 1rem;">
        <p style="font-size: 13px; color: #aaa; margin: 0;">Частота</p>
        <p style="font-size: 24px; font-weight: 500; margin: 4px 0 0; color: #fff;">50 Гц</p>
      </div>
    </div>
  </div>
</section>
